<!doctype html>
<meta charset="utf-8">
<title>Sprite build</title>
<!-- opened by build.mjs: paints every sprite and hands the pixels back -->
<script type="module">
import {makeSprites} from './index.js';
import {SHEETS, SPR} from './core.js';
const b64 = a => {
  let s = '';
  for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
  return btoa(s);
};
makeSprites();
window.result = {spr: SPR, sheets: SHEETS.map(({key, fw, fh, frames, rgba}) => ({key, fw, fh, frames, rgba: b64(rgba)}))};
</script>
