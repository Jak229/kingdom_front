<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Линия фронта</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="wrap">
  <div id="game"></div>
  <div id="corner"><button id="adbtn" hidden></button><button id="mbtn" hidden data-i="menuBtn" data-ia="menuBtn">Меню</button><button id="snd">Звук: вкл</button><button id="fsbtn" hidden data-ia="fsOn" aria-label="Во весь экран"></button></div>
  <div id="touch">
    <div id="pad"><button id="tl" data-ia="ar_left" aria-label="Влево">◀</button><button id="tr" data-ia="ar_right" aria-label="Вправо">▶</button></div>
    <div class="grp"><button id="tf" data-ia="ar_fast" aria-label="Газ">»</button><button id="tp" class="pay" data-ia="ar_pay" aria-label="Платить">★</button></div>
  </div>
  <div id="tut" hidden role="status" aria-live="polite"><div class="tt"><span class="tl"><span data-i="tut_label"></span><span id="tutDots"></span></span><span class="tb"><button id="tutNext" class="next" hidden></button><button id="tutSkip" data-i="tut_skip"></button></span></div><p id="tutText"></p></div>
  <div id="award" hidden role="status" aria-live="polite"><span id="awK"></span><b id="awT"></b><span id="awR"></span></div>
  <div class="overlay" id="rotate" hidden><div class="rot"><div class="phone"></div><p data-i="rotate"></p><button class="go alt" id="rotGo" data-i="rotateAnyway"></button></div></div>
  <div class="overlay" id="menu">
    <div class="card">
      <div class="stamp" id="menuStamp">Гарнизон «Перевал» · Приказ №1</div>
      <h1><span data-i="titleB">Линия фронта</span></h1>
      <div class="panel" id="pMain">
        <p class="tag" data-i="tag"></p>
        <div class="mbtns">
          <button class="go" id="resume" hidden data-i="m_resume"></button>
          <button class="go" id="cont" hidden></button>
          <button class="go" id="start">В бой</button>
          <button class="go alt daily" id="bDaily"></button>
          <button class="go alt meta" id="bMeta"></button>
          <button class="go alt" id="bHelp" data-i="m_help"></button>
          <button class="go alt" id="bSet" data-i="m_settings"></button>
          <button class="go alt" id="bAbout" data-i="m_about"></button>
        </div>
      </div>
      <div class="panel" id="pHelp" hidden>
        <p data-i="h_intro"></p>
        <p data-i="h_win"></p>
        <div class="keys">
          <span><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd></span><span data-i="k_move"></span>
          <span><kbd>Shift</kbd></span><span data-i="k_fast"></span>
          <span><kbd>↓</kbd> / <kbd>S</kbd> <span data-i="k_hold"></span></span><span data-i="k_pay"></span>
          <span><kbd>Esc</kbd> / <kbd>P</kbd></span><span data-i="k_menu"></span>
          <span><kbd>M</kbd></span><span data-i="k_sound"></span>
        </div>
        <p data-i="k_touch"></p>
        <p data-i="h_world"></p>
        <p data-i="h_nights"></p>
        <p data-i="h_foes"></p>
        <p data-i="h_meta"></p>
        <p data-i="h_daily"></p>
        <div class="btns"><button class="go alt" data-back data-i="m_back"></button></div>
      </div>
      <div class="panel" id="pSet" hidden>
        <div class="lbl" data-i="s_lang"></div>
        <div class="langs" id="langs"></div>
        <div class="row"><span data-i="s_sound"></span><button class="tog" id="tSound"></button></div>
        <div class="row" id="rVibro" hidden><span data-i="s_vibro"></span><button class="tog" id="tVibro"></button></div>
        <div class="row"><span data-i="s_tut"></span><button class="tog" id="tTut"></button></div>
        <div class="row"><span data-i="s_music"></span><span class="ctl"><input type="range" id="vMusic" min="0" max="100" step="5" data-ia="s_musicVol"><button class="tog" id="tMusic"></button></span></div>
        <div class="row"><span data-i="s_sfx"></span><span class="ctl"><input type="range" id="vSfx" min="0" max="100" step="5" data-ia="s_sfxVol"><span></span></span></div>
        <div class="btns"><button class="go alt" data-back data-i="m_back"></button></div>
      </div>
      <div class="panel" id="pMeta" hidden>
        <div class="mtop"><div class="tabs" id="metaTabs"><button data-tab="tasks" data-i="t_tasks"></button><button data-tab="ach" data-i="t_ach"></button><button data-tab="shop" data-i="t_shop"></button></div><span id="crBal"></span></div>
        <div id="metaBody"></div>
        <div class="btns"><button class="go alt" data-back data-i="m_back"></button></div>
      </div>
      <div class="panel" id="pDaily" hidden>
        <div id="dailyBody"></div>
        <div class="btns"><span id="dailyBtns"></span><button class="go alt" data-back data-i="m_back"></button></div>
      </div>
      <div class="panel" id="pAbout" hidden>
        <p data-i="a_text1"></p>
        <p data-i="a_text2"></p>
        <p class="ver" id="ver"></p>
        <div class="btns"><button class="go alt" data-back data-i="m_back"></button></div>
      </div>
    </div>
  </div>
  <div class="overlay" id="end" hidden>
    <div class="card">
      <div class="stamp" id="endStamp"></div>
      <h1 id="endTitle"></h1>
      <p id="endText"></p>
      <div class="btns"><button class="go" id="nextFront" hidden data-i="e_next"></button><button class="go alt" id="bonus" hidden></button><button class="go" id="restart" data-i="m_new"></button><button class="go alt" id="toMenu" data-i="m_main"></button></div>
    </div>
  </div>
</div>

<script src="vendor/phaser.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
