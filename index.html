<style>
/* Layout: full-bleed game canvas, stencil-style HTML overlays for briefing and touch controls */
:root{
  --bg:#0c0e14; --panel:rgba(14,16,20,.95); --fg:#ecebdc; --muted:#b4b49c;
  --accent:#d9b44a; --accent-ink:#1c1806; --line:#3b4030; --olive:#4b5a2e;
  --display:'Pixelify Sans','Rubik',"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif; --body:'Rubik',"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;height:100%}
#game{position:absolute;inset:0}
#game canvas{display:block}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(8,10,16,.55),rgba(4,5,8,.9));z-index:5}
#corner{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px}
#corner button{font-family:var(--display);font-size:13px;background:rgba(10,12,16,.6);color:var(--fg);border:1px solid var(--line);padding:6px 10px;cursor:pointer}
#mbtn::before{content:'\2630  '}
#fsbtn::before{content:'\26F6'}
html.touch #corner{top:8px;left:8px;right:auto;bottom:auto;flex-direction:column;gap:10px}
html.touch #corner button{width:44px;height:44px;padding:0;border-radius:50%;font-size:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,16,.55);border:2px solid rgba(255,255,240,.3)}
html.touch #mbtn::before,html.touch #fsbtn::before{content:'\2630';font-size:20px;line-height:1;font-family:var(--body)}
html.touch #fsbtn::before{content:'\26F6'}
html.touch #fsbtn.on{background:rgba(217,180,74,.35)}
html.touch #corner #snd{display:none}
html.touch .keys{display:none}
#rotate{z-index:8;background:var(--bg);text-align:center}
#rotate .phone{width:46px;height:78px;border:3px solid var(--fg);border-radius:9px;margin:0 auto 22px;position:relative;animation:turn 2.6s ease-in-out infinite}
#rotate .phone::after{content:'';position:absolute;left:50%;bottom:5px;width:10px;height:3px;margin-left:-5px;background:var(--fg);border-radius:2px}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
#rotate p{font-family:var(--display);font-size:20px;line-height:1.35;color:var(--fg);max-width:300px;margin:0 auto 20px}
@media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(-90deg)}}
.card{max-width:560px;width:100%;background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 4px rgba(0,0,0,.5);border-radius:0;padding:20px 22px 18px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;position:relative}
.card .stamp{font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.card h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1;margin:0;letter-spacing:.03em;text-wrap:balance;text-shadow:0 3px 0 #000}
.card h1 span{color:var(--accent)}
.card p{margin:0;color:var(--muted);line-height:1.5}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;align-items:center}
kbd{font-family:var(--body);font-weight:600;font-size:12px;background:#22261b;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:2px 7px;color:var(--fg);white-space:nowrap}
button.go{font-family:var(--display);font-size:20px;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:12px 18px;cursor:pointer;align-self:flex-start}
button.go:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
button.go.alt{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:10px;position:sticky;bottom:-18px;margin:0 -22px -18px;padding:12px 22px 18px;background:linear-gradient(rgba(14,16,20,0),#0e1014 35%)}
#touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:4;-webkit-touch-callout:none}
html.touch #touch{display:flex}
#pad{display:flex;gap:6px;pointer-events:auto;touch-action:none}
#touch .grp{display:flex;gap:12px;align-items:flex-end}
#touch button{pointer-events:auto;touch-action:none;width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,240,.35);background:rgba(16,18,12,.45);color:#fff;font-size:26px;font-family:var(--body);-webkit-tap-highlight-color:transparent}
#touch #tf{width:58px;height:58px;font-size:24px;margin-bottom:26px}
#touch button.pay{width:80px;height:80px;background:rgba(217,180,74,.6);color:var(--accent-ink);font-weight:600;font-size:26px}
#touch button.on{background:rgba(255,255,240,.32)}
#touch button.pay.on{background:rgba(240,206,110,.85)}
#touch.dash #tf{background:rgba(217,180,74,.45)}
@media (max-height:360px){#touch button{width:62px;height:62px}#touch button.pay{width:70px;height:70px}#touch #tf{width:52px;height:52px}}
.panel{display:flex;flex-direction:column;gap:12px}
.card p.tag{color:var(--fg);font-size:15px}
.mbtns{display:flex;flex-direction:column;gap:8px;max-width:360px}
.mbtns button.go{align-self:stretch;text-align:left;font-size:18px;padding:10px 16px}
button.go.warn{background:#b8462f;color:#fff}
.lbl{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.langs button,.tog{font-family:var(--body);font-size:15px;background:transparent;color:var(--fg);border:2px solid var(--line);border-radius:3px;padding:8px 6px;cursor:pointer}
.langs button.sel{border-color:var(--accent);color:var(--accent);background:rgba(217,180,74,.1)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.tog{min-width:84px;color:var(--muted)}
.tog.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.card button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.card p.ver{font-size:13px}
.ctl{display:grid;grid-template-columns:min(170px,34vw) 84px;align-items:center;gap:12px}
.ctl input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
@media (max-width:420px){.langs{grid-template-columns:repeat(2,1fr)}}

#tut{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:min(500px,calc(100% - 150px));z-index:4;background:rgba(12,14,18,.86);border:1px solid var(--line);border-left:4px solid var(--accent);padding:8px 12px 9px;box-shadow:0 2px 0 rgba(0,0,0,.45)}
#tut .tt{display:flex;align-items:center;justify-content:space-between;gap:10px}
#tut .tl{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
#tutDots{display:flex;gap:4px}#tutDots i{width:6px;height:6px;background:#3b4030}#tutDots i.on{background:var(--accent)}#tutDots i.cur{background:var(--fg)}
#tut .tb{display:flex;gap:6px}
#tut button{font-family:var(--body);font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:3px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#tut button.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#tut button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#tutText{margin:6px 0 0;font-size:15px;line-height:1.4;color:var(--fg)}
#tutText kbd{font-size:13px;padding:0 6px;margin:0 1px}
@media (max-height:460px){#tut{padding:5px 10px 6px}#tutText{font-size:13px;line-height:1.35;margin-top:3px}#tut button{font-size:12px;padding:2px 9px}#tut .tl{font-size:10px}}

@media (max-height:460px){.card{padding:12px 18px 12px;gap:8px}.card h1{font-size:30px}.card p.tag{font-size:13px;line-height:1.35}.card p{line-height:1.4}
  .mbtns{display:grid;grid-template-columns:1fr 1fr;max-width:none}.mbtns button.go{font-size:16px;padding:8px 14px}.btns{bottom:-12px;margin:0 -18px -12px;padding:8px 18px 12px}}
</style>
</head>

  foe_shield:'Новый враг: щитоносцы. Щит держит пули, а снайпер, миномёт, ПТУР и пушка танка пробивают его сразу',foe_jumper:'Новый враг: прыгуны. Они перепрыгивают стены, держите солдат и турели за ними',foe_bomber:'Новый враг: подрывники. Взрываются у стен и людей, сбивайте их издалека: взрыв задевает соседних роботов',foe_jammer:'Новый враг: глушилки. Рядом с ними молчат турели, миномёты, ПТУР и снайпер, выбивать их придётся солдатам',out_ram:'Таран идёт {0}! Разгоняется и с ходу бьёт в стены',out_hive:'Матка летит {0}! Пока цела, сбрасывает роботов к стенам',out_howitzer:'Гаубица идёт {0}! Обстреливает стены издалека, её достанут снайпер, миномёт и ПТУР',out_colossus:'Колосс идёт {0}! Его импульс глушит турели и миномёты',sideL:'слева',sideR:'справа',down_ram:'Таран уничтожен!',down_hive:'Матка сбита!',down_howitzer:'Гаубица уничтожена!',down_colossus:'Колосс повержен!',fuelBoss:' С ними идёт босс фронта',h_foes:'Каждый новый фронт приносит своего робота и своего босса. II: щитоносцы и Таран. III: прыгуны и Матка. IV: подрывники и Гаубица. V: глушилки и Колосс. Дальше они идут вперемешку.',
  tut_label:'Обучение',tut_skip:'Пропустить',tut_next:'Дальше',tut_done:'Готово',tut_off:'Обучение пропущено. Включить его снова можно в настройках',s_tut:'Обучение в новой игре',tut0:'Это ваша бронемашина, командир. Проедьте немного: [move], а с [fast] быстрее.',tut1:'У базы бродят добровольцы. Подъедьте к человеку под стрелкой и нажмите [pay]: призыв стоит 1 жетон.',tut2:'Новобранцу нужно оружие. Держите [pay] у арсенала, пока не оплатите автомат: новобранец заберёт его и станет солдатом.',tut3:'Строят только сапёры. Призовите ещё одного добровольца и купите набор сапёра на инженерном складе.',tut4:'Теперь укрепление. Держите [pay] у места под стрелкой: сапёр сложит мешки с песком, они задержат роботов.',tut5:'Жетоны — всё ваше снабжение. Днём солдаты сбивают разведдроны, а штаб каждое утро выдаёт жетоны. Подбирайте их, проезжая рядом.',tut6:'Темнеет. Ночью из порталов на обоих флангах выходят роботы. Возвращайтесь к штабу: солдаты встретят их у стен.',tut7:'Ночь. Не выезжайте за стены. Робот, добравшийся до вас, выбивает жетоны, а без жетонов база падёт. Продержитесь до рассвета.',tut8:'Рассвет, игра сохранена. Дальше сами: призывайте людей, укрепляйте штаб, чтобы открыть новые постройки, и ищите технику за стенами. Удачи, командир!',

  h_intro:'You command a forward base of the Pereval Garrison. By day, call up volunteers, hand out gear and fortify your positions. At night, combat robots pour out of enemy portals on both flanks.',
  h_win:'There are two ways to win. One: build the Elbrus missile system, deliver a missile, protect it through several fuelling nights, then strike the portals with radar guidance. Two: send special forces in a BTR-80 to destroy both portals.',
  h_world:'Beyond the walls there are vehicle depots (Ural with sidecar, BRDM-2, T-64BV), a radio tower, a radar, a hermit engineer, a service dog and supply caches. Nothing gets built without sappers. By day, soldiers shoot down recon drones and the wreckage drops tokens. If a robot reaches a commander who has run out of tokens, it seizes the banner and the base falls.',
  h_nights:'From the third night, transport drones drop robots behind your walls, and on assault nights a walker comes out. Seasons change every three days: in winter supply depots stand idle and nights are longer. After a victory the commander and the squad move on to the next front. The game saves at every dawn.',

  k_touch:'On a phone: ◀ ▶ to drive, you can slide your thumb between them. Throttle: » or double-tap an arrow. Hold ★ to pay. ☰ pauses, ⛶ goes full screen.',
  rotate:'Turn your phone sideways to see more of the battlefield',rotateAnyway:'Play upright',fsOn:'Full screen',fsOff:'Exit full screen',s_vibro:'Vibration',
  a_text1:'A small browser game inspired by Kingdom: Two Crowns and moved to the present day: a forward base instead of a kingdom, supply tokens instead of coins, an armoured vehicle instead of a horse.',

  tut_label:'Tutorial',tut_skip:'Skip',tut_next:'Next',tut_done:'Done',tut_off:'Tutorial skipped. You can turn it back on in Settings',s_tut:'Tutorial in a new game',tut0:'This is your armoured truck, commander. Drive a little: [move], and [fast] to go faster.',tut1:'Volunteers wander near the base. Drive up to the person under the arrow and press [pay]: recruiting costs 1 token.',tut2:'The recruit needs a weapon. Hold [pay] at the armoury until the rifle is paid for: the recruit will pick it up and become a soldier.',tut3:'Only sappers can build. Recruit one more volunteer and buy a sapper kit at the engineering depot.',tut4:'Now a defence. Hold [pay] at the spot under the arrow: a sapper will stack sandbags to hold the robots back.',tut5:'Tokens are all your supplies. Soldiers shoot down recon drones by day, and HQ hands out tokens every morning. Pick them up by driving past.',tut6:'It is getting dark. At night robots come out of the portals on both flanks. Head back to HQ: your soldiers will meet them at the walls.',tut7:'Night. Stay inside the walls. A robot that reaches you knocks out tokens, and with no tokens left the base falls. Hold out until dawn.',tut8:'Dawn, game saved. Now it is up to you: recruit people, upgrade HQ to unlock new buildings, and look for vehicles beyond the walls. Good luck, commander!',

  h_world:'Fuera de los muros hay depósitos de vehículos (Ural con sidecar, BRDM-2, T-64BV), una torre de radio, un radar, un ingeniero ermitaño, un perro militar y alijos de suministros. Sin zapadores no se construye nada. De día los soldados derriban drones de reconocimiento y de los restos caen fichas. Si un robot alcanza al comandante cuando no le quedan fichas, se lleva el estandarte y la base cae.',
  h_nights:'A partir de la tercera noche, los drones de transporte sueltan robots dentro de los muros, y en las noches de asalto aparece un caminante. Las estaciones cambian cada tres días: en invierno los depósitos de suministros se paran y las noches son más largas. Tras la victoria, el comandante y su escuadra parten al siguiente frente. La partida se guarda en cada amanecer.',

  foe_shield:'Nuevo enemigo: portaescudos. El escudo para las balas; el francotirador, el mortero, el misil antitanque y el cañón del tanque lo rompen al instante',foe_jumper:'Nuevo enemigo: saltadores. Saltan los muros, deja soldados y torretas detrás',foe_bomber:'Nuevo enemigo: bombarderos. Estallan junto a muros y personas; derríbalos de lejos, la explosión alcanza a los robots cercanos',foe_jammer:'Nuevo enemigo: inhibidores. Cerca de ellos callan torretas, morteros, el misil y el francotirador; tendrán que abatirlos los soldados',out_ram:'¡Un ariete llega {0}! Embiste los muros a toda velocidad',out_hive:'¡Una nave colmena llega {0}! Suelta robots junto a los muros hasta que la derriben',out_howitzer:'¡Un obús llega {0}! Bombardea los muros desde lejos; lo alcanzan el francotirador, el mortero y el misil',out_colossus:'¡Un coloso llega {0}! Su pulso inutiliza torretas y morteros',sideL:'por la izquierda',sideR:'por la derecha',down_ram:'¡Ariete destruido!',down_hive:'¡Nave colmena derribada!',down_howitzer:'¡Obús destruido!',down_colossus:'¡Coloso derribado!',fuelBoss:' Los acompaña el jefe del frente',h_foes:'Cada frente nuevo trae su propio robot y su propio jefe. II: portaescudos y el Ariete. III: saltadores y la Colmena. IV: bombarderos y el Obús. V: inhibidores y el Coloso. Después llegan todos mezclados.',

  h_intro:'Du befehligst einen vorgeschobenen Stützpunkt der Garnison „Perewal“. Am Tag rekrutierst du Freiwillige, gibst ihnen Ausrüstung und baust deine Stellungen aus. Nachts kommen Kampfroboter aus feindlichen Portalen an beiden Flanken.',
  h_win:'Es gibt zwei Wege zum Sieg. Erstens: Baue das Raketensystem „Elbrus“, bring eine Rakete heran, verteidige sie mehrere Betankungsnächte lang und schlage dann mit Radarlenkung gegen die Portale zu. Zweitens: Schick die Spezialkräfte im BTR-80 los, um beide Portale zu zerstören.',
  h_world:'Hinter den Mauern gibt es Fahrzeugdepots (Ural mit Beiwagen, BRDM-2, T-64BW), einen Funkturm, ein Radar, einen Einsiedler-Ingenieur, einen Diensthund und Versorgungsverstecke. Ohne Pioniere wird nichts gebaut. Tagsüber schießen Soldaten Aufklärungsdrohnen ab, aus den Trümmern fallen Marken. Erreicht ein Roboter den Kommandanten, wenn dieser keine Marken mehr hat, erobert er das Banner und der Stützpunkt fällt.',
  h_nights:'Ab der dritten Nacht setzen Transportdrohnen Roboter hinter deinen Mauern ab, und in Sturmnächten kommt ein Läufer. Die Jahreszeiten wechseln alle drei Tage: Im Winter stehen die Versorgungslager still und die Nächte sind länger. Nach dem Sieg zieht der Kommandant mit seinem Trupp an die nächste Front. Das Spiel wird bei jeder Morgendämmerung gespeichert.',

  foe_shield:'Neuer Gegner: Schildträger. Der Schild hält Kugeln ab; Scharfschütze, Mörser, Panzerabwehr und Panzerkanone brechen ihn sofort',foe_jumper:'Neuer Gegner: Springer. Sie springen über Mauern, halte Soldaten und Geschütze dahinter bereit',foe_bomber:'Neuer Gegner: Sprengroboter. Sie explodieren an Mauern und Menschen; schieß sie früh ab, die Explosion trifft Roboter in der Nähe',foe_jammer:'Neuer Gegner: Störsender. In ihrer Nähe schweigen Geschütze, Mörser, Panzerabwehr und Scharfschütze; Soldaten müssen sie ausschalten',out_ram:'Ein Rammbock kommt {0}! Er nimmt Anlauf und rammt die Mauern',out_hive:'Ein Schwarmschiff fliegt {0} heran! Es wirft Roboter an die Mauern, bis es abgeschossen ist',out_howitzer:'Eine Haubitze kommt {0}! Sie beschießt Mauern aus der Ferne; Scharfschütze, Mörser und Panzerabwehr reichen bis zu ihr',out_colossus:'Ein Koloss kommt {0}! Sein Impuls legt Geschütze und Mörser lahm',sideL:'von links',sideR:'von rechts',down_ram:'Rammbock zerstört!',down_hive:'Schwarmschiff abgeschossen!',down_howitzer:'Haubitze zerstört!',down_colossus:'Koloss gefallen!',fuelBoss:' Der Boss dieser Front ist dabei',h_foes:'Jede neue Front bringt einen eigenen Roboter und einen eigenen Boss. II: Schildträger und der Rammbock. III: Springer und das Schwarmschiff. IV: Sprengroboter und die Haubitze. V: Störsender und der Koloss. Danach kommen alle gemischt.',

const SET_KEY='kg-settings-v1';
const SET=(()=>{try{const s=JSON.parse(localStorage.getItem(SET_KEY)||'null');return s&&typeof s==='object'?s:{};}catch(e){return {};}})();
function saveSettings(){try{localStorage.setItem(SET_KEY,JSON.stringify(SET));}catch(e){}}
// browser language decides on the first visit (Belarusian and Kazakh readers get Russian), the menu choice is remembered
function detectLang(){const list=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];
  for(const x of list){const c=String(x).toLowerCase().slice(0,2);if(STR[c])return c;if(c==='be'||c==='kk')return 'ru';}return 'en';}
let LANG=STR[SET.lang]?SET.lang:detectLang();
function L_(){return STR[LANG]||STR.en;}
function tr(k,...a){let s=L_()[k];if(s==null)s=STR.en[k];if(s==null)return k;return String(s).replace(/\{(\d)\}/g,(m,i)=>a[i]);}
function tokN(n){return tr(n===1?'tok1':'tok',n);}
function tb(sec,k){const o=L_()[sec];return o&&o[k]!=null?o[k]:STR.en[sec][k];}
// names on the data tables read the current language, so the rules code keeps using d.name, d.desc, VEH[k].name…
for(const k in DEFS)Object.defineProperty(DEFS[k],'name',{get:()=>tb('b',k)});
for(const k in SHOPS)['name','tool','sign'].forEach((f,i)=>Object.defineProperty(SHOPS[k],f,{get:()=>tb('shop',k)[i]}));
for(const k in WILD)['name','sign','desc'].forEach((f,i)=>Object.defineProperty(WILD[k],f,{get:()=>tb('wild',k)[i]}));
for(const k in VEH)Object.defineProperty(VEH[k],'name',{get:()=>tb('veh',k)});
SEASONS.forEach((s,i)=>['name','note'].forEach((f,j)=>Object.defineProperty(s,f,{get:()=>tb('season',i)[j]})));
const TOOL_OF={};for(const k of ['guard','builder','farmer'])Object.defineProperty(TOOL_OF,k,{get:()=>tb('toolOf',k)});
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function lerpColor(c1,c2,t){const r=lerp(c1>>16&255,c2>>16&255,t),g=lerp(c1>>8&255,c2>>8&255,t),b=lerp(c1&255,c2&255,t);return (r<<16)|(g<<8)|b;}

let S=null;

function mkPerson(x,role,campX){
  return {x,role,campX,tx:x,side:x<C?-1:1,cd:rnd(0,2),work:0,anim:rnd(0,6),dir:1,speed:rnd(40,50),off:rnd(0,40),task:null,farm:null,working:false};
}
function newState(front){front=front||1;
  const s={front,coins:14,day:1,phaseT:0,night:false,nightT:0,over:false,won:false,running:false,

    toast:null,paying:null,rabbitCd:2,hires:0,rocketY:0,winT:0,kills:0};
  const add=(type,dx,minHq,level)=>{const sp={type,x:C+dx,level:level||0,minHq:minHq||0,paid:false,pending:0,progress:0,hp:0,maxHp:0,cd:0,aim:dx<0?-1:1};s.spots.push(sp);return sp;};
  s.hq=add('hq',0,0,1);

  ];
  for(const w of s.wild){w.pending=0;w.done=false;if(front%2===0)w.x=2*C-w.x;}
  for(const cx of s.camps)for(let i=0;i<3;i++)s.people.push(mkPerson(cx+rnd(-60,60),'vagrant',cx));
  s.people.push(mkPerson(C-320,'vagrant',s.camps[0]));

function reqFor(sp,lvl){const r=DEFS[sp.type].req;return Math.max(r[lvl]||0,sp.minHq);}
function canUpgrade(sp){const d=DEFS[sp.type];return sp.level<d.max&&!sp.paid&&S.hq.level>=reqFor(sp,sp.level+1);}
function toast(text,warn){S.toast={text,t:3.2,warn:!!warn};}
/* first-day tutorial: nine short steps from the first drive to the first dawn; each waits until the player has done it.
   at() is where the arrow points, show() hides a step until its moment, info steps move on by themselves */
function tutShop(k){return S.shops.find(s=>s.kind===k);}
function tutVagrant(){let b=null,bd=1e9;for(const m of S.people)if(m.role==='vagrant'){const d=Math.abs(m.x-S.player.x);if(d<bd){bd=d;b=m;}}return b&&{x:b.x,y:GY-50};}
function tutWall(){let b=null,bd=1e9;for(const sp of S.spots)if(sp.type==='wall'&&sp.level===0&&!sp.paid&&S.hq.level>=reqFor(sp,1)){const d=Math.abs(sp.x-S.player.x);if(d<bd){bd=d;b=sp;}}return b&&{x:b.x,y:pipY(b)-12};}
const TUT=[
  {done:t=>Math.abs(S.player.x-t.x0)>140},
  {at:tutVagrant,done:()=>S.people.some(m=>m.role!=='vagrant')},
  {at:()=>({x:tutShop('gun').x,y:GY-88}),done:()=>tutShop('gun').tools>0||S.people.some(m=>m.role==='guard')},
  {at:()=>S.people.filter(m=>m.role!=='vagrant').length<2?tutVagrant():{x:tutShop('tool').x,y:GY-88},done:()=>tutShop('tool').tools>0||S.people.some(m=>m.role==='builder')},
  {at:tutWall,done:()=>S.spots.some(sp=>sp.type==='wall'&&(sp.paid||sp.level>0))},
  {info:true,done:t=>t.t>12},
  {at:()=>({x:S.hq.x,y:pipY(S.hq)-12}),show:()=>S.night||S.phaseT>=dayLen()-22,done:()=>S.night},
  {done:()=>!S.night&&S.day>1},
  {info:true,last:true,done:t=>t.t>16}];
// while the first lessons run, the first day goes at half speed so nobody is rushed into the night
function tutClock(){const t=S.tut;return t&&t.i<5&&S.day===1&&!S.night?.5:1;}
function tutStep(dt){const t=S.tut;t.t+=dt;
  if(t.i<6&&(S.night||S.phaseT>=dayLen()-22)){t.i=6;t.t=0;}
  const st=TUT[t.i];if(!st.done(t))return;
  if(st.last)tutEnd(false);else{t.i++;t.t=0;}}
function tutEnd(skipped){S.tut=null;SET.tut=false;saveSettings();syncToggles();if(skipped)toast(tr('tut_off'));}

// sound requests: the rules only say what happened and where, the audio side decides how it sounds
function sfx(k,x,a){const q=S.sfx||(S.sfx=[]);if(q.length<48)q.push({k,x,a});}
// the rocket stands on the pad outside the walls and is fuelled for a few nights; robots go for it
function fuelNeed(){return (S.front||1)>1?3:2;}
function rocketX(){return S.launch.x-23.5*SP;}
function rocketUp(){const l=S.launch;return l.level===2&&l.hp>0;}
function rocketHp(){return Math.round(DEFS.launch.hp*(1+.25*((S.front||1)-1))*(S.buff.hermit?1.5:1));}
function hasRadar(){return S.wild.some(w=>w.type==='radar'&&w.done);}
function rocketLost(){const l=S.launch;l.level=1;l.hp=l.maxHp=0;l.fuel=0;l.paid=false;l.progress=0;
  const rx=rocketX();S.booms.push({x:rx,life:.6});for(let i=0;i<34;i++)puff(rx+rnd(-20,20),GY-rnd(10,130),i%2?0x3a3540:0xff8a3c,1);
  sfx('radio',null,{v:'alert',d:.8});toast(tr('rocketLost'),true);}
function puff(x,y,color,n){for(let i=0;i<(n||6);i++)S.puffs.push({x,y,vx:rnd(-40,40),vy:rnd(-70,-10),life:rnd(.4,.9),color});}
function dropCoin(x,y){if(S.ground.length<80)S.ground.push({x,y:y||GY-30,vx:rnd(-30,30),vy:rnd(-120,-60),landed:false});}
function outerWall(side){let best=null;for(const sp of S.spots)if(sp.type==='wall'&&sp.level>0&&Math.sign(sp.x-C)===side){if(best===null||Math.abs(sp.x-C)>Math.abs(best-C))best=sp.x;}return best;}
// soldiers hold both flanks: a new rifle goes to the thinner flank, and a gap of two sends the nearest man across
function guardSides(list,skip){let l=0,r=0;for(const m of list)if(m!==skip&&m.role==='guard'){if(m.side<0)l++;else r++;}return [l,r];}
function pickSide(st,skip){const [l,r]=guardSides(st.people,skip),alt=(st.hires++%2)?1:-1;return l<r?-1:r<l?1:alt;}
function balanceGuards(){const [l,r]=guardSides(S.people);if(Math.abs(l-r)<2)return;const from=l>r?-1:1;let best=null,bd=1e9;
  for(const m of S.people)if(m.role==='guard'&&m.side===from){const d=Math.abs(m.x-C)+(m.hurt>0?1e4:0);if(d<bd){bd=d;best=m;}}
  best.side=-from;best.wait=0;if(!S.night)best.tx=C+best.side*rnd(620,1500);}
function nearestCamp(x){return Math.abs(x-S.camps[0])<Math.abs(x-S.camps[1])?S.camps[0]:S.camps[1];}

function findTarget(){
  const p=S.player;let best=null,bd=1e9;
  for(const v of S.people)if(v.role==='vagrant'){const d=Math.abs(v.x-p.x);if(d<30&&d<bd){bd=d;best={kind:'vagrant',obj:v};}}
  if(best)return best;
  for(const sp of S.spots){const d=Math.abs(sp.x-p.x);const r=sp.type==='hq'?70:sp.type==='farm'||sp.type==='launch'?62:sp.type==='barracks'?42:36;if(d<r&&d<bd){bd=d;best={kind:'spot',obj:sp};}}
  for(const sh of S.shops){const d=Math.abs(sh.x-p.x);if(d<38&&d<bd){bd=d;best={kind:'shop',obj:sh};}}
  for(const w of S.wild){if(w.type==='cache')continue;const d=Math.abs(w.x-p.x);if(d<46&&d<bd){bd=d;best={kind:'wild',obj:w};}}
  return best;
}
function targetInfo(t){
  if(!t)return null;
  if(t.kind==='vagrant')return {payable:true,cost:1,text:tr('recruit')};
  if(t.kind==='wild'){const w=t.obj;
    if(w.type==='depot'){const vn=VEH[w.veh].name;
      if(!w.done)return {payable:true,cost:w.cost,text:tr('depotBuy',vn)};
      if(S.player.veh===w.veh)return {payable:true,cost:0,action:'swap',to:'jeep',text:tr('swapBack',VEH.jeep.name)};
      return {payable:true,cost:0,action:'swap',to:w.veh,text:tr('swapTo',vn)};}
    const d=WILD[w.type];
    if(w.done)return {payable:false,text:tr('wildDone',d.name,d.desc)};
    return {payable:true,cost:d.cost,text:tr('wildBuy',d.name,d.desc)};}
  if(t.kind==='shop'){
    const sh=t.obj,d=SHOPS[sh.kind];
    if(S.hq.level<sh.minHq)return {payable:false,text:tr('shopLocked',d.name,DEFS.hq.name[sh.minHq])};
    if(sh.tools>=4)return {payable:false,text:tr('shopFull',d.name)};
    return {payable:true,cost:d.cost,text:tr('shopGive',d.name,d.tool)};
  }
  const sp=t.obj,d=DEFS[sp.type];
  if(sp.paid)return {payable:false,text:tr('waitSapper',d.name[sp.level+1])};
  if(sp.type==='bank'&&sp.level>0){
    if(S.coins<=2&&sp.saved>0)return {payable:false,text:tr('bankGive')};
    return {payable:true,cost:1,action:'deposit',text:tr('bankDeposit',tokN(sp.saved||0))};}
  if(sp.type==='barracks'&&sp.level>0){
    const q=S.squad;
    if(!q)return {payable:true,cost:6,action:'squad',text:tr('squadForm')};
    if(S.night)return {payable:false,text:tr('squadNight')};
    if(q.mode==='assault')return {payable:false,text:tr('squadAssault')};
    if(q.mode==='return')return {payable:false,text:tr('squadReturn')};
    const pi=assaultTarget();
    if(pi<0)return {payable:false,text:tr('portalsDead')};
    if(S.phaseT>dayLen()-55)return {payable:false,text:tr('tooLate')};
    return {payable:true,cost:4,action:'assault',text:tr(pi===0?'assaultL':'assaultR',Math.ceil(q.hp),q.maxHp)};}
  if(sp.type==='launch'&&sp.level===2){const need=fuelNeed(),f=sp.fuel||0,hp=tr('rocketHp',Math.ceil(sp.hp),sp.maxHp);
    if(f<need)return {payable:false,text:tr('rocketFuel',f,need)+hp};
    if(!hasRadar())return {payable:false,text:tr('rocketNeedRadar')+hp};
    return {payable:true,cost:d.cost[3],text:tr('rocketStrike')};}
  if(sp.level>=d.max)return {payable:false,text:d.name[sp.level]};
  const rq=reqFor(sp,sp.level+1);
  if(sp.type==='launch'&&sp.level===1&&S.hq.level>=rq)return {payable:true,cost:d.cost[2],text:tr('rocketDeliver',fuelNeed())};
  if(S.hq.level<rq)return {payable:false,text:tr('needHq',d.name[sp.level+1],DEFS.hq.name[rq])};
  return {payable:true,cost:d.cost[sp.level+1],text:sp.type==='hq'?tr('hqUp',d.name[sp.level+1]):d.name[sp.level+1]};
}
function refund(){if(S.paying&&S.paying.pending>0){S.coins+=S.paying.pending;S.paying.pending=0;}S.paying=null;}

function handlePay(dt){
  const p=S.player;p.payCd-=dt;
  if(!input.pay)S.swapLatch=false;
  const t=findTarget();S.target=t;S.targetInfo=targetInfo(t);
  if(S.paying&&(!input.pay||!t||t.obj!==S.paying))refund();
  if(!input.pay||!t||!S.targetInfo.payable||p.payCd>0)return;
  if(S.coins<=0&&S.targetInfo.action!=='swap'){if(!S.toast||S.toast.text!==tr('noTokens'))toast(tr('noTokens'),true);return;}
  if(S.targetInfo.action==='swap'){if(!S.swapLatch){swapVehicle(t.obj,S.targetInfo.to);}return;}
  p.payCd=0.22;S.coins--;
  if(S.targetInfo.action==='deposit'){t.obj.saved=(t.obj.saved||0)+1;puff(t.obj.x,GY-30,0xd9b44a,3);return;}
  if(t.kind==='vagrant'){sfx('recruit',t.obj.x);t.obj.role='idle';t.obj.cd=0;puff(t.obj.x,GY-20,0xd9b44a,8);p.payCd=0.4;return;}
  const o=t.obj;o.pending++;S.paying=o;
  if(o.pending>=S.targetInfo.cost){
    o.pending=0;S.paying=null;p.payCd=0.45;
    if(t.kind==='shop'){o.tools++;sfx('equip',o.x);puff(o.x,GY-50,0xd9b44a,8);}
    else if(t.kind==='wild')unlockWild(o);
    else if(S.targetInfo.action==='squad'){S.squad={x:o.x+30,hp:30,maxHp:30,mode:'home',cd:0,anim:0,dir:1,side:1,pick:0};puff(o.x,GY-20,0xd9b44a,12);sfx('radio',null,{v:'order'});toast(tr('squadFormed'));}
    else if(S.targetInfo.action==='assault'){S.squad.mode='assault';S.squad.target=assaultTarget();sfx('radio',null,{v:'order'});toast(tr('squadGo'));}
    else{o.paid=true;o.progress=0;puff(o.x,GY-40,0xd9b44a,10);sfx('order',o.x);
      if(!S.people.some(m=>m.role==='builder'))toast(tr('needSapper'));}
  }
}

function completeSpot(sp){
  sp.level++;sp.paid=false;sp.progress=0;const d=DEFS[sp.type];
  if(sp.type==='wall'){sp.maxHp=sp.hp=Math.round(d.hp[sp.level]*(S.buff.hermit?1.5:1));}
  puff(sp.x,GY-40,0xe8e4c8,12);sfx(sp.type==='hq'?'hqUp':'built',sp.x);
  if(sp.type==='hq'){
    toast(tr('hqOpens',d.name[sp.level],tr('opens'+sp.level)));
  }else if(sp.type==='launch'&&sp.level===2){sp.fuel=0;sp.maxHp=sp.hp=rocketHp();sfx('radio',null,{v:'rocket'});
    toast(tr('rocketOnPad',fuelNeed()),true);}
  else if(sp.type==='launch'&&sp.level===3){S.won=true;S.winT=0;sfx('rocket',rocketX());toast(tr('launchGo'));}
  else toast(tr('built',d.name[sp.level]));
}

function kill(target){
  if(target.dead)return;target.dead=true;
  if(target.isEnemy){S.kills++;sfx(target.boss?'walkerDie':target.fly?'droneDie':target.brute?'bruteDie':'robotDie',target.x);puff(target.x,target.y||GY-16,0xff5a3c,10);for(let i=0;i<target.loot+(target.bounty||0);i++)dropCoin(target.x,target.fly?target.y:GY-20);
    if(target.fly){dropCargo(target);for(let i=0;i<8;i++)puff(target.x+rnd(-12,12),target.y,i%2?0x333333:0xff8a3c,1);}
    if(target.boss){S.booms.push({x:target.x,life:.5});for(let i=0;i<24;i++)puff(target.x+rnd(-30,30),GY-rnd(10,70),i%2?0x3a3540:0xff8a3c,1);toast(tr(target.kind?'down_'+target.kind:'walkerDown'));}
    if(target.kind==='bomber')bombBoom(target.x,false,target);}
  else{puff(target.x,target.y,0x55574f,8);dropCoin(target.x,target.y);sfx('droneDie',target.x);}
}
function fire(x0,y0,target,dmg,acc,color,snd){
  sfx(snd||'rifle',x0);
  const hit=Math.random()<acc*(target.fly?.6:1);
  S.tracers.push({x1:x0,y1:y0,x2:target.x+(hit?0:rnd(-14,14)),y2:target.y+(hit?0:rnd(-10,10)),life:.12,color:color||0xfff1a6});
  if(!hit)return;
  hitE(target,dmg,dmg>=3);
}

/* ---------- people ---------- */
function wander(m,cx,r,dt){if(Math.abs(m.x-m.tx)<3){m.cd-=dt;if(m.cd<=0){m.tx=cx+rnd(-r,r);m.cd=rnd(1.5,4);}}}
function nearestEnemy(x,range,minR){let b=null,bd=range;for(const e of S.enemies){if(e.dead)continue;const d=Math.abs(e.x-x);if(d<bd&&d>=(minR||0)){bd=d;b=e;}}return b;}
function updPerson(m,dt){
  m.anim+=dt;m.working=false;
  if(m.role==='vagrant'){
    if(Math.abs(m.x-m.campX)>120)m.tx=m.campX+rnd(-60,60);
    wander(m,m.campX,70,dt);
  }else if(m.role==='idle'){
    let sh=null,bd=1e9;for(const s of S.shops)if(s.tools>0){const d=Math.abs(s.x-m.x);if(d<bd){bd=d;sh=s;}}
    if(sh){m.tx=sh.x;if(Math.abs(m.x-sh.x)<4){sh.tools--;m.role=SHOPS[sh.kind].role;puff(m.x,GY-20,0xb8d080,6);
      if(m.role==='guard')m.side=pickSide(S,m);}}
    else wander(m,C,170,dt);
  }else if(m.role==='guard'&&m.hurt>0){
    const md=S.medic;m.tx=md.x+(m.off-20)*.3;if(Math.abs(m.x-m.tx)<6){m.healT-=dt;if(m.healT<=0){m.hurt=0;puff(m.x,GY-24,0x8fd16a,8);}}
  }else if(m.role==='guard'){
    if(S.night){const ow=outerWall(m.side);m.tx=m.side>0&&rocketUp()?S.launch.x-34-m.off:ow!==null?ow-m.side*(26+m.off):C+m.side*(110+m.off);}
    else{if(Math.abs(m.tx-C)<380&&Math.abs(m.x-m.tx)<3)m.tx=C+m.side*rnd(620,1500);
      if(Math.abs(m.x-m.tx)<3){m.wait=(m.wait||0)+dt;if(m.wait>rnd(2,6)){m.wait=0;m.tx=C+m.side*rnd(620,1500);}}}
    m.shotCd=(m.shotCd||0)-dt;
    if(m.shotCd<=0){
      const gr=S.buff.tower?370:300;let t=nearestEnemy(m.x,gr);
      if(!t&&!S.night){let bd=240;for(const r of S.rabbits){const d=Math.abs(r.x-m.x);if(!r.dead&&d<bd){bd=d;t=r;}}}
      if(t){m.dir=Math.sign(t.x-m.x)||1;fire(m.x+m.dir*8,GY-17,t,1,t.isEnemy?(S.buff.tower?.96:.85):(S.buff.tower?.7:.55));m.shotCd=t.isEnemy?1:1.5;m.aimT=.3;}
    }
  }else if(m.role==='builder'){
    if(S.night){m.task=null;wander(m,C,90,dt);}
    else{
      const valid=sp=>sp&&(sp.paid||((sp.type==='wall'&&sp.level>0||sp.type==='launch'&&sp.level===2)&&sp.hp<sp.maxHp));
      if(!valid(m.task)){m.task=null;let bd=1e9;for(const sp of S.spots)if(valid(sp)){const d=Math.abs(sp.x-m.x);if(d<bd){bd=d;m.task=sp;}}}
      const sp=m.task;
      if(sp){m.tx=sp.x+(m.off-20)*0.4;
        if(Math.abs(m.x-m.tx)<6){m.working=true;
          if(sp.paid){sp.progress+=dt/DEFS[sp.type].time[sp.level+1];if(sp.progress>=1)completeSpot(sp);}
          else sp.hp=Math.min(sp.maxHp,sp.hp+(S.buff.hermit?6:3)*dt);
          if(Math.random()<dt*6)puff(sp.x+rnd(-12,12),GY-rnd(10,40),0xb5a988,1);}}
      else wander(m,C,200,dt);
    }
  }else if(m.role==='farmer'){
    if(!m.farm||m.farm.level<1){m.farm=null;let bc=2;for(const sp of S.spots)if(sp.type==='farm'&&sp.level>0){const c=S.people.filter(o=>o.farm===sp).length;if(c<bc){bc=c;m.farm=sp;}}}
    if(S.night||!m.farm||!season().farm)wander(m,C,100,dt);
    else{m.tx=m.farm.x+(m.off-20)*1.1;if(Math.abs(m.x-m.tx)<4){m.working=true;m.work+=dt;if(m.work>=8/season().farm){m.work=0;dropCoin(m.farm.x+rnd(-20,20),GY-34);}}}
  }
  const dx=m.tx-m.x;
  if(Math.abs(dx)>1.5){const sp=m.speed*(m.role==='vagrant'?.7:1)*(S.night&&m.role!=='vagrant'?1.5:1);m.x+=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt);if(!m.aimT||m.aimT<=0)m.dir=Math.sign(dx);m.moving=true;}else m.moving=false;
  if(m.aimT)m.aimT-=dt;
}

/* ---------- enemies ---------- */
function startNight(){
  S.night=true;S.phaseT=0;S.nightT=0;S.queue=[];if(S.convoy){for(let i=0;i<3;i++)dropCoin(S.convoy.x,GY-30);S.convoy=null;}
  const assault=S.day%5===0;sfx('radio',null,{v:'night',d:2.6});if(assault)sfx('siren',C);
  const F=(S.front||1)-1;let drones=Math.round((2+S.day*1.6)*(1+.25*F)),brutes=Math.floor(S.day/3)+F;
  if(assault){drones*=2;brutes+=2;}
  // the front's own robots take some of the small ones' places; the newest kind comes in larger numbers and is introduced once
  const front=S.front||1,top=Math.min(front,5);
  for(const k in FOE_FRONT){const f0=FOE_FRONT[k];if(f0>front)continue;
    let n=Math.max(f0===top?1:0,Math.round(drones*(f0===top?.2:.12)));if(k==='jammer')n=Math.min(n,1+Math.floor(S.day/6));n=Math.min(n,drones-1);if(n<=0)continue;drones-=n;
    for(let i=0;i<n;i++)S.queue.push({t:rnd(2,nightLen()*.55),side:i%2?-1:1,type:k});
    if(f0===front&&!S.seen.includes(k)){S.seen.push(k);later(5,tr('foe_'+k),true);}}
  for(let i=0;i<drones;i++)S.queue.push({t:rnd(0,nightLen()*.5),side:i%2?1:-1,type:'drone'});
  for(let i=0;i<brutes;i++)S.queue.push({t:rnd(4,nightLen()*.5),side:i%2?-1:1,type:'brute'});
  // from night 3 transport drones carry robots over the walls; assault nights bring the walker
  const carriers=Math.min(8,(S.day>=Math.max(1,3-F)?Math.floor((S.day-1)/2)+1:0)+(assault?2:0)+F-(S.day>=3?1:0));
  for(let i=0;i<carriers;i++)S.queue.push({t:rnd(3,nightLen()*.4),side:i%2?1:-1,type:'carrier'});
  const walkers=assault?(S.day>=10?2:1)+(F>=2?1:0):0;
  for(let i=0;i<walkers;i++)S.queue.push({t:1+i*6,side:Math.random()<.5?-1:1,type:frontBoss(i)});
  for(const r of S.rabbits)r.dead=true;
  if(rocketUp()){const n=Math.round(drones*.4);for(let i=0;i<n;i++)S.queue.push({t:rnd(2,nightLen()*.6),side:1,type:'drone'});
    for(let i=0;i<1+F;i++)S.queue.push({t:rnd(6,nightLen()*.5),side:1,type:'brute'});
    const last=(S.launch.fuel||0)>=fuelNeed()-1;if(F>1&&last)S.queue.push({t:rnd(8,14),side:1,type:frontBoss(0)});
    toast((assault?tr('assaultPrefix'):'')+tr(last?'fuelNightLast':'fuelNight')+(F>1&&last?tr(frontBoss(0)==='walker'?'fuelWalker':'fuelBoss'):'')+tr('fuelGuards'),true);return;}
  toast(assault?(frontBoss(0)==='walker'?tr('nightAssault'):tr('assaultPrefix')+tr('nightN',S.day)):tr('nightN',S.day)+(carriers?tr('nightCarriers'):''),assault);
}
function startDay(){
  S.night=false;S.phaseT=0;S.day++;sfx('radio',null,{v:'dawn',d:2.2});
  for(const e of S.enemies)if(!e.dead){e.dead=true;puff(e.x,GY-16,0xffa040,8);}
  for(const m of S.people)m.hurt=0;
  S.emps=[];S.eshells=[];
  for(const cx of S.camps){const n=S.people.filter(m=>m.role==='vagrant'&&Math.abs(m.x-cx)<200).length;for(let i=0;i<season().recruits&&n+i<5;i++)S.people.push(mkPerson(cx+rnd(-50,50),'vagrant',cx));}
  for(let i=0;i<S.hq.level;i++)dropCoin(C+rnd(-40,40),GY-50);
  if(S.bank.level>0&&S.bank.saved>0)S.bank.saved+=Math.max(1,Math.floor(S.bank.saved*.2));
  if(S.hq.level>=2&&S.day%2===0&&season().convoy)startConvoy();
  const newSeason=seasonIdx(S.day)!==seasonIdx(S.day-1),L=S.launch;let fm='';
  if(rocketUp()&&(L.fuel||0)<fuelNeed()){L.fuel=(L.fuel||0)+1;fm=L.fuel>=fuelNeed()?tr('fuelDone')+tr(hasRadar()?'fuelReady':'fuelRadar'):tr('fuelStep',L.fuel,fuelNeed());}
  const saved=saveGame();toast(fm+(newSeason?season().note:tr('dawn',S.day)+(saved?tr('saved'):'')));
}
/* later fronts: from front II each front brings one new robot and its own boss; from front VI on they all come mixed */
const FOE_FRONT={shield:2,jumper:3,bomber:4,jammer:5};
const BOSS_OF=['walker','walker','ram','hive','howitzer','colossus'];
function frontBoss(i){const f=S.front||1;if(f<BOSS_OF.length)return i===0?BOSS_OF[f]:'walker';const all=['ram','hive','howitzer','colossus','walker'];return all[(f+i*2)%all.length];}
function later(t,text,warn){S.later.push({t,text,warn});}
function bossHp(){return 36+S.day*3+10*((S.front||1)-1);}
function spawnBoss(q,x){const k=q.type,side=q.side,hp=Math.round(bossHp()*{ram:1,hive:.7,howitzer:.8,colossus:1.35}[k]);

/* ---------- main step ---------- */
function step(dt){
  if(!S.running||S.over||S.paused)return;
  if(S.won){if(S.wonBy==='portals'){S.winT+=dt;for(const q of S.puffs){q.life-=dt;}if(S.winT>5&&!S.endShown){S.endShown=true;showEnd(true);}return;}S.winT+=dt;S.rocketY+=S.winT*120*dt;if(Math.random()<.8)puff(rocketX()+rnd(-6,6),GY-28-S.rocketY,0xffb347,2);
    if(S.winT>4&&!S.endShown){S.endShown=true;showEnd(true);}return;}
  const p=S.player;
  const dir=(input.right?1:0)-(input.left?1:0);
  if(dir){const vs=VEH[p.veh];p.dir=dir;p.x=clamp(p.x+dir*(input.fast?vs.fast:vs.speed)*dt,40,WORLD-40);p.anim+=dt*(input.fast?2:1);}
  p.hitCd-=dt;
  handlePay(dt);
  S.phaseT+=dt*tutClock();
  if(!S.night&&S.phaseT>=dayLen())startNight();
  else if(S.night&&S.phaseT>=nightLen())startDay();
  if(S.tut)tutStep(dt);
  if(S.night){S.nightT+=dt;for(let i=S.queue.length-1;i>=0;i--)if(S.queue[i].t<=S.nightT){spawnEnemy(S.queue[i]);S.queue.splice(i,1);}}
  // enemy recon drones fly over in daytime (soldiers shoot them down for scrap)
  if(!S.night){S.rabbitCd-=dt;if(S.rabbitCd<=0&&S.rabbits.length<5){const sd=Math.random()<.5?-1:1;S.rabbits.push({x:C+sd*rnd(620,2400),y:GY-rnd(70,140),tx:0,ty:0,hp:1,cd:rnd(1,3),dead:false,anim:0});S.rabbitCd=rnd(4,8);}}
  for(const r of S.rabbits){r.anim+=dt;r.cd-=dt;if(r.cd<=0){r.tx=clamp(r.x+rnd(-140,140),300,WORLD-300);r.ty=GY-rnd(70,140);r.cd=rnd(2,4);}
    if(r.tx){r.x+=(r.tx-r.x)*Math.min(1,dt*.8);r.y+=(r.ty-r.y)*Math.min(1,dt*.8);}}
  S.rabbits=S.rabbits.filter(r=>!r.dead);
  balanceGuards();for(const m of S.people)updPerson(m,dt);
  for(const e of S.enemies)if(!e.dead)updEnemy(e,dt);
  if(S.over)return;
  updSquad(dt);updMissiles(dt);updBank();updConvoy(dt);updWild(dt);updDog(dt);
  if(rocketUp()&&Math.random()<dt*3)S.puffs.push({x:rocketX()+rnd(-6,6),y:GY-rnd(26,34),vx:rnd(-20,20),vy:rnd(-30,-10),life:rnd(.6,1.1),color:0xe8eef0});
  if(S.won)return;
  for(const sp of S.spots){if(sp.type==='atgm'&&sp.level>0)updAtgm(sp,dt);if(sp.type==='sniper'&&sp.level>0)updSniper(sp,dt);if(sp.type==='turret'&&sp.level>0)updTurret(sp,dt);else if(sp.type==='mortar'&&sp.level>0)updMortar(sp,dt);if(sp.recoil)sp.recoil=Math.max(0,sp.recoil-dt);}
  updShells(dt);updFoeFx(dt);
  S.enemies=S.enemies.filter(e=>!e.dead);
  for(const c of S.ground){if(!c.landed){c.vy+=420*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.y>=GY-4){c.y=GY-4;c.landed=true;}}
    else if(Math.abs(c.x-p.x)<22&&S.coins<PURSE){c.taken=true;S.coins++;}}
  S.ground=S.ground.filter(c=>!c.taken);
  for(const t of S.tracers)t.life-=dt;S.tracers=S.tracers.filter(t=>t.life>0);
  for(const q of S.puffs){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=60*dt;}S.puffs=S.puffs.filter(q=>q.life>0);
  if(S.toast){S.toast.t-=dt;if(S.toast.t<=0)S.toast=null;}
}
/* ---------- save at dawn, like the original ---------- */
const SAVE_KEY='kg-front-save-v1';
function saveGame(st){const S=st||window.__kg.S;try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,front:S.front,coins:S.coins,day:S.day,hires:S.hires,kills:S.kills,buff:S.buff,portalHp:S.portalHp,portalDead:S.portalDead,
  player:{x:Math.round(S.player.x),veh:S.player.veh,dir:S.player.dir},
  spots:S.spots.map(sp=>({level:sp.level,hp:sp.hp,maxHp:sp.maxHp,saved:sp.saved||0,paid:sp.paid,progress:sp.progress,fuel:sp.fuel||0})),
  shops:S.shops.map(sh=>sh.tools),wild:S.wild.map(w=>w.done),
  people:S.people.map(m=>[Math.round(m.x),m.role,m.campX,m.side,Math.round(m.off)]),
  squad:S.squad?{x:Math.round(S.squad.x),hp:S.squad.hp,maxHp:S.squad.maxHp}:null}));return true;}catch(e){return false;}}
function readSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return s&&s.v===1?s:null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadGame(sv){const n=newState(sv.front||1);
  for(const k of ['coins','day','hires','kills','buff','portalHp','portalDead'])if(sv[k]!=null)n[k]=sv[k];
  Object.assign(n.player,sv.player);n.spots.forEach((sp,i)=>Object.assign(sp,sv.spots[i]||{}));
  n.shops.forEach((sh,i)=>sh.tools=sv.shops[i]||0);n.wild.forEach((w,i)=>w.done=!!sv.wild[i]);
  n.people=sv.people.map(([x,role,campX,side,off])=>{const m=mkPerson(x,role,campX);m.side=side;m.off=off;return m;});
  if(n.wild.some(w=>w.type==='dog'&&w.done))n.dog={x:n.player.x-40,dir:1,anim:0,mode:'follow',digCd:30,barkCd:0,t:0,moving:false};
  if(sv.squad)n.squad={x:sv.squad.x,hp:sv.squad.hp,maxHp:sv.squad.maxHp,mode:'home',cd:0,anim:0,dir:1,side:1,pick:0};
  return n;}
function darkness(){
  if(!S)return 0;
  if(S.night)return 1;
  if(S.phaseT<6)return S.day===1?0:1-S.phaseT/6;
  const dl=dayLen();if(S.phaseT>dl-9)return (S.phaseT-(dl-9))/9;
  return 0;
}
// after a victory the commander moves on to the next front with part of the team
function nextFrontState(o){const n=newState((o.front||1)+1);n.coins=Math.min(PURSE,o.coins+10);n.kills=o.kills;let g=0,b=0;
  for(const m of o.people){if(m.role==='guard'&&g<4)g++;else if(m.role==='builder'&&b<2)b++;else continue;const p=mkPerson(C+rnd(-90,90),m.role,C);if(m.role==='guard')p.side=pickSide(n,p);n.people.push(p);}
  if(o.dog){n.wild.find(w=>w.type==='dog').done=true;n.buff.dog=true;n.dog={x:n.player.x-40,dir:1,anim:0,mode:'follow',digCd:30,barkCd:0,t:0,moving:false};}
  n.carried={g,b};return n;}
function gameOver(){if(S.over)return;S.over=true;showEnd(false);}
function showEnd(won){
  if(won){S.nextFront=nextFrontState(S);saveGame(S.nextFront);}else clearSave();
  S.endWon=won;fillEnd();AU.jingle(won);
  document.getElementById('menu').hidden=true;document.getElementById('end').hidden=false;syncCorner();

  let t=won?tr(S.wonBy==='portals'?'e_portals':'e_rocket',S.day,S.kills):tr('e_lose',S.day,S.kills);
  if(won){const c=S.nextFront.carried;t+=tr('e_carry',roman(S.front),roman(S.front+1),c.g,c.b,S.dog?tr('e_dog'):'',S.front,S.front+1);}

/* ---------- rendering ---------- */
/* sprite-pixel helpers: column/row of a sprite to world coordinates */
function spx(key,x,c,flip){const s=SPR[key],fw=s.w+2,t=flip?fw-2-c:c+1;return x+(t-Math.floor(fw/2))*SP;}
function spy(key,y,r){return y-(SPR[key].h-r)*SP;}

function lit(fx,key,x,y,rects,col,a,flip){if(a<=0.01)return;fx.fillStyle(col,a);for(const [c,r,w,h] of rects)fx.fillRect(flip?spx(key,x,c+w-1,true):spx(key,x,c),spy(key,y,r),w*SP,h*SP);}
const LIT={hq1:[[25,18,2,12]],hq2:[[29,21,10,9]],hq3:[[10,20,8,2],[24,20,8,2],[40,20,8,2],[54,20,8,2],[30,28,10,12]],
  hq4:[[34,12,26,4],...[0,1,2,3,4,5].map(i=>[10+i*13,32,8,4]),...[0,1,4,5].map(i=>[10+i*13,44,8,4])],wall3:[[4,15,16,2]],hermit:[[9,16,6,5]]};
const SPOT_KEY={sniper:()=>'sniper',medic:()=>'medic',wall:l=>'wall'+l,turret:l=>'turret'+l,mortar:()=>'mortar',atgm:()=>'atgm',bank:()=>'bank',barracks:()=>'barracks',farm:()=>'supply',launch:()=>'launch',hq:l=>'hq'+l};
function flame(fx,x,y,t,seed){const h=6+Math.sin(t*14+seed)*2+Math.random()*3;fx.fillStyle(0xff7a22,.95);fx.fillRect(x-4,y-h,8,h);fx.fillStyle(0xffc84a,1);fx.fillRect(x-2,y-h*.7,4,h*.7);fx.fillStyle(0xfff0b0,1);fx.fillRect(x-1,y-h*.35,2,h*.35);}
function drawPortal(fx,x,dark,i){
  if(S.portalDead[i]){fx.fillStyle(0x3a3a34,.9);fx.fillTriangle(x-26,GY,x+26,GY,x,GY-18);if(Math.random()<.2)S.puffs.push({x:x+rnd(-10,10),y:GY-16,vx:rnd(-6,6),vy:-30,life:1.2,color:0x6a6a62});return;}
  const t=performance.now()/400,a=.35+.55*dark;
  if(S.portalHp[i]<40){fx.fillStyle(0x000000,.6);fx.fillRect(x-24,GY-100,48,4);fx.fillStyle(0xc77dff,1);fx.fillRect(x-24,GY-100,48*S.portalHp[i]/40,4);}
  fx.fillStyle(0x5b1e8a,a*.6);fx.fillEllipse(x,GY-42,44,84);
  fx.lineStyle(2,0xc77dff,a);fx.strokeEllipse(x,GY-42,44+Math.sin(t)*4,84+Math.cos(t)*4);
  fx.lineStyle(1,0xe0b0ff,a*.7);fx.strokeEllipse(x,GY-42,26+Math.cos(t*1.3)*4,58+Math.sin(t*1.3)*6);
}
function drawScaffold(g,sp){
  const key=SPOT_KEY[sp.type](Math.max(1,sp.level+1)),hh=SPR[key].h*SP,ww=Math.min(140,SPR[key].w*SP);
  g.lineStyle(2,0xc9a441,.9);g.strokeRect(sp.x-ww/2,GY-hh,ww,hh);
  for(let y=GY-hh;y<GY;y+=16)g.lineBetween(sp.x-ww/2,y,sp.x+ww/2,y);
  g.lineBetween(sp.x-ww/2,GY,sp.x+ww/2,GY-hh);
  g.fillStyle(0x000000,.6);g.fillRect(sp.x-20,GY-hh-12,40,5);g.fillStyle(0xd9b44a,1);g.fillRect(sp.x-20,GY-hh-12,40*sp.progress,5);

/* vehicles: facing right; crew variants carry the commander and the garrison flag */
/* real-world vehicles, side view facing right. Polygons are filled per texel row so sloped armour reads cleanly */
function pfill(P,pts,col){let y0=1e9,y1=-1e9;for(const [,y] of pts){y0=Math.min(y0,y);y1=Math.max(y1,y);}
  for(let ty=Math.floor(y0*R);ty<Math.ceil(y1*R);ty++){const yc=(ty+.5)/R,xs=[];
    for(let i=0;i<pts.length;i++){const [ax,ay]=pts[i],[bx,by]=pts[(i+1)%pts.length];if((ay<=yc&&by>yc)||(by<=yc&&ay>yc))xs.push(ax+(yc-ay)/(by-ay)*(bx-ax));}
    xs.sort((a,b)=>a-b);for(let k=0;k+1<xs.length;k+=2){const a=Math.round(xs[k]*R),b=Math.round(xs[k+1]*R);if(b>a)P.t(a,ty,b-a,1,col);}}}
function bolts(P,x0,x1,y,step,col){for(let x=x0;x<=x1;x+=step)P.t(Math.round(x*R),Math.round(y*R),1,1,col);}
// small steel road wheel of a tracked vehicle
function roadWheel(P,cx,cy,r,f,rub,disc){P.ell(cx,cy,r,r,rub||'#2a2a26');P.ell(cx,cy,r*.68,r*.68,disc||'#5d5e54');P.ell(cx,cy,r*.25,r*.25,'#34352f');
  const a=(f%2)*Math.PI/3;for(let k=0;k<3;k++){const an=a+k*Math.PI*2/3;P.t(Math.round((cx+.5+Math.cos(an)*r*.45)*R),Math.round((cy+.5+Math.sin(an)*r*.45)*R),1,1,'#41423a');}
  P.t(Math.round((cx+.5-r*.35)*R),Math.round((cy+.5-r*.4)*R),1,1,'#8c8d80');}

const $=id=>document.getElementById(id);
/* touch screens: a drive pad you can slide across, throttle (or double-tap an arrow), hold-to-pay, compact corner buttons */
const touch={left:false,right:false,pay:false,fast:false,dash:false};
let TOUCH=false;

(function(){const pad=$('pad'),L=$('tl'),R=$('tr'),T=$('touch');let pid=null,lastT=0,lastD=0;
  const set=d=>{touch.left=d<0;touch.right=d>0;L.classList.toggle('on',d<0);R.classList.toggle('on',d>0);};
  const dirAt=x=>{const b=pad.getBoundingClientRect();return x<b.left+b.width/2?-1:1;};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();if(pid!==null)return;pid=e.pointerId;try{pad.setPointerCapture(pid);}catch(_){}
    const d=dirAt(e.clientX),now=performance.now();touch.dash=d===lastD&&now-lastT<350;T.classList.toggle('dash',touch.dash);lastT=now;lastD=d;set(d);buzz(8);});

  const up=e=>{if(e.pointerId!==pid)return;pid=null;set(0);touch.dash=false;T.classList.remove('dash');};
  pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
  for(const [id,key] of [['tp','pay'],['tf','fast']]){const el=$(id);let p=null;
    el.addEventListener('pointerdown',e=>{e.preventDefault();p=e.pointerId;try{el.setPointerCapture(p);}catch(_){}touch[key]=true;el.classList.add('on');buzz(8);});
    const off=e=>{if(e.pointerId!==p)return;p=null;touch[key]=false;el.classList.remove('on');};

    [...$('tutDots').children].forEach((e,i)=>{e.className=i<t.i?'on':i===t.i?'cur':'';});}
  if(fresh)layoutTut();}
$('tutSkip').addEventListener('click',e=>{e.currentTarget.blur();if(S&&S.tut)tutEnd(true);});
$('tutNext').addEventListener('click',e=>{e.currentTarget.blur();const t=S&&S.tut;if(!t)return;if(TUT[t.i].last)tutEnd(false);else{t.i++;t.t=0;}});
$('tTut').addEventListener('click',()=>{SET.tut=SET.tut===false;saveSettings();syncToggles();});
$('tVibro').addEventListener('click',()=>{SET.vibro=SET.vibro===false;saveSettings();syncToggles();buzz(30);});
// settings: master sound and music are remembered with the language
AU.muted=SET.sound===false;AU.music=SET.music!==false;
const vol01=(v,d)=>typeof v==='number'&&v>=0&&v<=1?v:d;AU.musicVol=vol01(SET.musicVol,.7);AU.sfxVol=vol01(SET.sfxVol,.8);
$('vMusic').value=Math.round(AU.musicVol*100);$('vSfx').value=Math.round(AU.sfxVol*100);
// browsers only allow sound after a gesture: the first click or key starts it (the menu theme on the title screen)
for(const ev of ['pointerdown','keydown'])window.addEventListener(ev,()=>AU.init(),true);
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.card button,#corner button'))AU.fx.ui.call(AU);});
// a hidden tab stops all sound (and the engine loops cannot get stuck)
document.addEventListener('visibilitychange',()=>{if(document.hidden&&inGame())openMenu();if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume();});
function syncToggles(){
  for(const [id,on] of [['tSound',!AU.muted],['tMusic',AU.music],['tVibro',SET.vibro!==false],['tTut',SET.tut!==false]]){const b=$(id);b.textContent=tr(on?'on':'off');b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));}
  $('snd').textContent=tr('snd',tr(AU.muted?'off':'on'));}
function toggleSound(){AU.setMuted(!AU.muted);SET.sound=!AU.muted;saveSettings();syncToggles();}
$('snd').addEventListener('click',e=>{AU.init();toggleSound();e.currentTarget.blur();});
$('tSound').addEventListener('click',()=>{AU.init();toggleSound();});
$('tMusic').addEventListener('click',()=>{AU.init();if(AU.ctx)AU.setMusic(!AU.music);else AU.music=!AU.music;SET.music=AU.music;saveSettings();syncToggles();});
$('vMusic').addEventListener('input',e=>{const v=e.target.value/100;AU.init();if(AU.ctx)AU.setMusic(AU.music,v);else AU.musicVol=v;SET.musicVol=v;});
$('vSfx').addEventListener('input',e=>{const v=e.target.value/100;AU.init();if(AU.ctx)AU.setSfx(v);else AU.sfxVol=v;SET.sfxVol=v;});
for(const id of ['vMusic','vSfx'])$(id).addEventListener('change',()=>{saveSettings();if(id==='vSfx'&&AU.ctx)AU.play({k:'rifle',x:null});});

// menu: the same card is the title screen and the pause screen
const inGame=()=>!!(S&&S.running&&!S.over&&!S.won);
function saveLabel(s){return s.front>1?tr('saveFrontDay',roman(s.front),roman(s.day),s.front,s.day):tr('saveDay',roman(s.day),s.day);}
let confirmT=-1e9,panel='pMain';
function refreshMenu(){
  const ig=inGame(),sv=ig?null:readSave(),st=$('start'),c=$('cont');
  $('resume').hidden=!ig;c.hidden=!sv;if(sv)c.textContent=tr('m_contSave',saveLabel(sv));
  const pending=ig&&performance.now()-confirmT<6000;
  st.textContent=pending?tr('m_confirmNew'):tr(ig||sv||(S&&(S.over||S.won))?'m_new':'m_start');
  st.classList.toggle('alt',!!(ig||sv)&&!pending);st.classList.toggle('warn',pending);
  $('menuStamp').textContent=ig?tr('m_paused')+' · '+saveLabel(S):tr('stamp');}
function showPanel(id){panel=id;for(const p of ['pMain','pHelp','pSet','pAbout'])$(p).hidden=p!==id;$('menu').firstElementChild.scrollTop=0;}
function syncCorner(){const play=$('menu').hidden&&$('end').hidden;$('mbtn').hidden=!play;$('touch').hidden=!play;layoutCorner();}
function openMenu(){if(!$('end').hidden)return;if(inGame())S.paused=true;confirmT=-1e9;refreshMenu();showPanel('pMain');$('menu').hidden=false;syncCorner();}
function closeMenu(){$('menu').hidden=true;if(S)S.paused=false;syncCorner();}
$('mbtn').addEventListener('click',e=>{e.currentTarget.blur();openMenu();});
$('resume').addEventListener('click',closeMenu);
$('bHelp').addEventListener('click',()=>showPanel('pHelp'));
$('bSet').addEventListener('click',()=>showPanel('pSet'));
$('bAbout').addEventListener('click',()=>showPanel('pAbout'));
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>showPanel('pMain')));
window.addEventListener('keydown',e=>{
  if((e.key!=='Escape'&&e.code!=='KeyP')||e.repeat||!$('end').hidden)return;
  if(!$('menu').hidden){if(panel!=='pMain')showPanel('pMain');else if(inGame())closeMenu();}
  else if(inGame())openMenu();});

// languages
const langBox=$('langs');
for(const [code,name] of LANGS){const b=document.createElement('button');b.textContent=name;b.lang=code;b.dataset.l=code;
  b.addEventListener('click',()=>{LANG=code;SET.lang=code;saveSettings();applyLang();});langBox.appendChild(b);}
function applyLang(){
  document.documentElement.lang=LANG;document.title=tr('docTitle');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=tr(e.dataset.i);});
  document.querySelectorAll('[data-ia]').forEach(e=>e.setAttribute('aria-label',tr(e.dataset.ia)));
  for(const b of langBox.children){const on=b.dataset.l===LANG;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',String(on));}
  $('ver').textContent=tr('a_ver',VERSION);
  syncToggles();refreshMenu();if(S){S.toast=null;if(!$('end').hidden)fillEnd();}}
applyLang();
setTouchMode(matchMedia('(pointer:coarse)').matches);syncCorner();setTimeout(layoutCorner,300);

function boot(){new Phaser.Game({type:Phaser.AUTO,parent:'game',backgroundColor:'#0c0e14',width:Math.round(W*K),height:Math.round(H*K),
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},render:{antialias:true,pixelArt:false},scene:Main});}
const fontReady=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('20px "Pixelify Sans"','AaБбЇїÑñÜüß'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontReady.then(boot,boot);

function begin(sv,next){$('menu').hidden=true;$('end').hidden=true;syncCorner();if(!S)return;AU.init();
  if(next)S=next;else if(sv)S=loadGame(sv);else if(S.over||S.won)S=newState();S.running=true;S.paused=false;const sc=window.__kg&&window.__kg.scene;if(sc){sc.showBanner(S.day);sc.camX=clamp(S.player.x-W/2,0,WORLD-W);}
  S.tut=!next&&!sv&&S.front===1&&S.day===1&&SET.tut!==false?{i:0,t:0,x0:S.player.x}:null;
  if(!S.tut)toast(next?tr('beginNext',roman(S.front),S.front):sv?tr('beginCont'):tr('beginNew'));}
// during a running operation "New operation" asks for a second click
$('start').addEventListener('click',()=>{
  if(inGame()){if(performance.now()-confirmT>6000){confirmT=performance.now();refreshMenu();setTimeout(refreshMenu,6100);return;}S=newState();}
  confirmT=-1e9;begin();});
$('cont').addEventListener('click',()=>{const cur=readSave();if(cur)begin(cur);else begin();});
$('restart').addEventListener('click',()=>{clearSave();S=newState();begin();});
$('nextFront').addEventListener('click',()=>{const nx=S.nextFront;if(nx)begin(null,nx);});
$('toMenu').addEventListener('click',()=>{$('end').hidden=true;openMenu();});
})();
</script>
</body>
</html>
